name: Release

on:
  push:
    tags:
      - "v*"
      - "assert/v*"
      - "slogx/v*"
      - "stringx/v*"
      - "concx/v*"
      - "httpx/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0 for golib, httpx/v1.0.0 for a submodule)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Parse module and version from tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG##*/}"
          prefix="${TAG%%/*}"

          if [[ "$TAG" == */* && -f "$prefix/go.mod" ]]; then
            dir="$prefix"
            name="$prefix"
          else
            dir="."
            name="golib"
          fi

          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
            echo "title=$name $version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ steps.meta.outputs.dir }}/go.mod
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Verify module standalone
        working-directory: ${{ steps.meta.outputs.dir }}
        env:
          GOWORK: "off"
        run: |
          go mod tidy -diff
          go test -v -race ./...

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "${{ steps.meta.outputs.title }}" \
            --generate-notes
